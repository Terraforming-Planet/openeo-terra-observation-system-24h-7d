name: TerraObserver safe openEO plan unit tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -B -m compileall -q terraobserver tests
      - run: git diff --check
# No openEO credentials, no API access, no start_job, no billed computations.
